<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">

<title>Directorio InnovaClub 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;700;800&display=swap">
<style>
/* Layout: cabecera CORFO (logo | divisor | título) + franja fotográfica, buscador fijo, grilla de fichas agrupada por empresa */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#19165C; --ink-2:#4A4878; --muted:#6E7391;
  --line:#D5DBE5; --blue:#005FAA; --red:#D84047; --chip:#E1E8F1; --focus:#005FAA;
  --logo:#005FAA; --ok:#1C7C4A;
  --f:"Albert Sans","Aptos","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0D2E; --surface:#18174A; --ink:#EEF1FA; --ink-2:#C4C6E6; --muted:#9A9EC4;
  --line:#2C2B66; --blue:#6FB2F0; --red:#EE6A70; --chip:#232260; --focus:#8CC3F5; --logo:#FFFFFF; --ok:#5FD39A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D2E; --surface:#18174A; --ink:#EEF1FA; --ink-2:#C4C6E6; --muted:#9A9EC4;
  --line:#2C2B66; --blue:#6FB2F0; --red:#EE6A70; --chip:#232260; --focus:#8CC3F5; --logo:#FFFFFF; --ok:#5FD39A; color-scheme:dark}
*{box-sizing:border-box}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
.wrap{max-width:1720px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.lb{fill:var(--logo)} .lr{fill:var(--red)}
header.top{padding-block:40px 32px}
.brand{display:flex;align-items:center;gap:clamp(18px,3vw,36px)}
.logo{width:clamp(110px,14vw,150px);height:auto;flex:none}
.divider{width:2px;align-self:stretch;min-height:64px;background:var(--ink);flex:none}
.brand h1{margin:0;font-weight:300;font-size:clamp(26px,4.2vw,44px);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{font-weight:800}
.brand p{margin:8px 0 0;color:var(--ink-2);font-size:15px}
.band{display:flex;width:100%;height:clamp(150px,21vw,340px);overflow:hidden;background:var(--line)}
.band img{flex:1 1 0;min-width:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding-block:16px}
.search{flex:1 1 320px;min-width:0;position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
#q{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:13px 44px 13px 46px}
#q::placeholder{color:var(--muted)}
#q:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:14px;border:0;background:none;color:var(--ink-2);padding:10px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;font-size:13px;color:var(--muted)}
.meta strong{color:var(--ink);font-variant-numeric:tabular-nums}
.btn-ghost{font:inherit;font-size:13px;color:var(--blue);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
main{padding-block:28px 64px}
.group{margin-bottom:36px}
.group h2{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;padding-left:14px;border-left:2px solid var(--ink);font-size:19px;font-weight:700;line-height:1.25;text-wrap:balance}
.group h2 em{font-style:normal;min-width:0}
.group h2 span{font-weight:400;font-size:13px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:16px}
@media (max-width:1300px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:960px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:1fr;grid-auto-rows:auto}}
.cols{column-width:300px;column-gap:16px}
.cols .group{break-inside:avoid;display:flex;flex-direction:column;gap:12px;margin:0 0 28px}
.cols .group h2{margin:0;font-size:17px}
.cols .group .card{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .who{min-width:0}
.card .name{font-size:17px;font-weight:700;line-height:1.25}
.card .role{color:var(--ink-2);font-size:14px;margin-top:2px}
.card .org{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.3;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.card .rows{margin-top:auto}
.rows{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row .k{flex:none;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8}
.row .v{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px;user-select:all;font-variant-numeric:tabular-nums}
.cp{flex:none;font:inherit;font-size:12px;font-weight:600;color:var(--blue);background:var(--chip);border:0;border-radius:4px;padding:6px 10px;cursor:pointer;min-width:66px}
.cp:hover{filter:brightness(.96)}
.cp.done{color:var(--ok)}
.all{align-self:flex-start;font:inherit;font-size:13px;font-weight:600;color:var(--surface);background:var(--ink);border:0;border-radius:4px;padding:8px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.all.done{background:var(--ok)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
mark{background:color-mix(in srgb,var(--red) 22%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
footer{border-top:1px solid var(--line);padding-block:20px 32px;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer .stripe{display:inline-flex;height:4px;width:70px}
footer .stripe i{flex:287}
footer .stripe i+i{flex:351;background:var(--red)}
footer .stripe i:first-child{background:var(--logo)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:560px){.divider{min-height:52px}.brand p{font-size:13px}.seg{width:100%}.seg button{flex:1}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

const ICON = {
  mail:'<svg class="k" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  tel:'<svg class="k" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>'
};
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
DATA.forEach((d,i)=>{ d.id=i; d.key = norm([d.n,d.c,d.a].join(' ')); });
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(text, q){
  if(!q) return esc(text);
  const n = norm(text); let out='', i=0, j;
  while((j = n.indexOf(q,i)) !== -1){ out += esc(text.slice(i,j)) + '<mark>' + esc(text.slice(j,j+q.length)) + '</mark>'; i = j+q.length; }
  return out + esc(text.slice(i));
}
let view = 'emp';
try{ view = localStorage.getItem('ic-view') || 'emp'; }catch(e){}
const $ = id => document.getElementById(id);
const list=$('list'), q=$('q');
let visible = [];

function card(d, qq, showOrg){
  const mails = d.e.map(m=>`<div class="row">${ICON.mail}<span class="v">${esc(m).replace('@','<wbr>@')}</span><button class="cp" type="button" data-copy="${esc(m)}" data-what="Correo">Copiar</button></div>`).join('');
  return `<article class="card">
    <div class="who">
      <div class="org">${hl(d.c,qq)}</div>
      <div class="name">${hl(d.n,qq)}</div>
      <div class="role">${esc(d.r)}</div>
    </div>
    <div class="rows">
      ${mails}
      <div class="row">${ICON.tel}<span class="v">${esc(d.tp)}</span><button class="cp" type="button" data-copy="${d.t}" data-what="Teléfono">Copiar</button></div>
    </div>
    <button class="all" type="button" data-all="${d.id}">Copiar contacto completo</button>
  </article>`;
}
function render(){
  const qq = norm(q.value.trim());
  $('clear').hidden = !qq;
  visible = DATA.filter(d => !qq || qq.split(/\s+/).every(t => d.key.includes(t)));
  const orgs = new Set(visible.map(d=>d.c)).size;
  $('count').innerHTML = `<strong>${visible.length}</strong> ${visible.length===1?'contacto':'contactos'} · <strong>${orgs}</strong> ${orgs===1?'organización':'organizaciones'}`;
  $('copyVisible').hidden = !visible.length;
  if(!visible.length){ list.innerHTML = `<div class="empty"><b>Sin resultados para “${esc(q.value.trim())}”</b>Prueba con otra parte del nombre o de la empresa.</div>`; return; }
  const single = qq.includes(' ') ? qq : qq; // same query used for highlight
  const s=[...visible].sort(view==='per'
    ? (a,b)=>norm(a.n).localeCompare(norm(b.n))
    : (a,b)=>norm(a.c).localeCompare(norm(b.c)) || norm(a.n).localeCompare(norm(b.n)));
  list.innerHTML = `<div class="grid">${s.map(d=>card(d,single)).join('')}</div>`;
}
function setView(v){
  view=v; $('v-emp').setAttribute('aria-pressed',v==='emp'); $('v-per').setAttribute('aria-pressed',v==='per');
  try{ localStorage.setItem('ic-view',v);}catch(e){}
  render();
}
let tt;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
}
function copy(text, btn, label){
  const done = ok => {
    if(!ok){ toast('No se pudo copiar. Selecciona el texto y usa Ctrl/Cmd + C.'); return; }
    toast(label+' copiado'); if(btn){ const o=btn.textContent; btn.classList.add('done'); btn.textContent= btn.classList.contains('all')?'Copiado ✓':'Copiado'; setTimeout(()=>{btn.classList.remove('done'); btn.textContent=o;},1500); }
  };
  try{ navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(fallbackCopy(text))); }
  catch(e){ done(fallbackCopy(text)); }
}
const full = d => `${d.n}\n${d.r}\n${d.c}\n${d.e.join(' / ')}\n${d.tp}`;
list.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.copy) copy(b.dataset.copy, b, b.dataset.what);
  else if(b.dataset.all) copy(full(DATA[+b.dataset.all]), b, 'Contacto');
});
$('copyVisible').addEventListener('click', ()=>{
  const rows=[['Empresa','Nombre','Cargo','Correo','Teléfono'].join('\t'), ...visible.map(d=>[d.c,d.n,d.r,d.e.join(' / '),d.tp].join('\t'))];
  copy(rows.join('\n'), null, visible.length+' contactos');
});
q.addEventListener('input', render);
$('clear').addEventListener('click', ()=>{ q.value=''; render(); q.focus(); });
$('v-emp').addEventListener('click', ()=>setView('emp'));
$('v-per').addEventListener('click', ()=>setView('per'));
setView(view==='per'?'per':'emp');
</script>
